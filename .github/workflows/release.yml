name: release

on:
  # No `paths` filter: it matches nothing on a branch's first push, whose
  # diff has no base commit. The tag-exists check below is the real guard.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Decided before the toolchain is installed: a version that is already
  # tagged has nothing to release, and everything below it is waste.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        name: Read the workspace version and ask whether it is new
        run: |
          # Anchored to the section: a workspace root's first `version = ` is
          # only the package's by accident, and a dependency pinned above it
          # would silently become the release number.
          VERSION="v$(awk '
            /^\[workspace\.package\]/ { in_pkg = 1; next }
            /^\[/                     { in_pkg = 0 }
            in_pkg && /^version = /   { gsub(/version = "|"/, ""); print; exit }
          ' Cargo.toml)"
          if [ "$VERSION" = "v" ]; then
            echo "::error::no version under [workspace.package] in Cargo.toml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "$VERSION is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}

      # Before the tag, not after. A release is a claim that this version
      # works, and the tag is what makes the claim.
      - name: Test
        run: cargo test --locked --release --target "$TARGET"

      - name: Build
        run: cargo build --locked --release --target "$TARGET"

      - name: Stage
        run: cp "target/$TARGET/release/pi" "pi-$TARGET"

      # Tagged only once the thing being tagged is known to build and pass.
      # Tagging first — which is what the workflows this is modelled on do —
      # leaves a tag with no release behind a failed build, and the next push
      # will not retry it: the tag exists, so the check above says there is
      # nothing to do, and the only way out is deleting the tag by hand.
      #
      # Tag and release in one run because a push made with GITHUB_TOKEN does
      # not start a new workflow run, so the tag cannot trigger the release.
      - name: Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          generate_release_notes: true
          files: pi-${{ env.TARGET }}
