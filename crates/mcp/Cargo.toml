[package]
name = "mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MCP servers as a source of tools"

[dependencies]
llm.workspace = true
tool.workspace = true
http = "1"
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
tracing.workspace = true
rmcp = { version = "3.5", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest-tls-no-provider",
] }
# The crypto reqwest already uses here, installed for rmcp's client too:
# its own default would build aws-lc from C.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
