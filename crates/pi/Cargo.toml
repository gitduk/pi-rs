[package]
name = "pi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "pi: a terminal coding agent"

repository = "https://github.com/gitduk/pi-rs"
[[bin]]
name = "pi"
path = "src/main.rs"

[dependencies]
futures = { workspace = true }
agent.workspace = true
subagent.workspace = true
skills.workspace = true
llm.workspace = true
channel.workspace = true
tool.workspace = true
toolbox.workspace = true
wechat.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
tokio-util.workspace = true
libc = "0.2"
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-width = "0.2.2"
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste", "windows"] }
ignore.workspace = true

serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
serde_path_to_error.workspace = true
ratatui = "0.30.2"
tui-markdown = "0.3"

[dev-dependencies]
tempfile = "3"
