[package]
name = "pi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "pi: a terminal coding agent"

repository = "https://github.com/gitduk/pi-rs"

# The release note is one file at the repository root, outside this crate's
# directory; cargo-release reads `file` relative to the crate it bumps.
[package.metadata.release]
pre-release-replacements = [
  { file = "../../CHANGELOG.md", search = "## Unreleased", replace = "## {{version}} - {{date}}", min = 1 },
]

[[bin]]
name = "pi"
path = "src/main.rs"

[dependencies]
pi-core.workspace = true
pi-store.workspace = true
skills.workspace = true
ui.workspace = true
agent.workspace = true
llm.workspace = true
tool.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tempfile = "3"
tokio.workspace = true

[dev-dependencies]
execution.workspace = true
pi-tools.workspace = true
serde_json.workspace = true
