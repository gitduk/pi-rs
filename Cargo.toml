[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.23.4"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
llm = { path = "crates/llm" }
tool = { path = "crates/tool" }
toolbox = { path = "crates/toolbox" }
mcp = { path = "crates/mcp" }
agent = { path = "crates/agent" }
subagent = { path = "crates/subagent" }
skills = { path = "crates/skills" }
channel = { path = "crates/channel" }
wechat = { path = "crates/wechat" }
pi-store = { path = "crates/pi-store" }
pi-core = { path = "crates/pi-core" }
ui = { path = "crates/ui" }

anyhow = "1"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"
toml = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
ignore = "0.4"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
clap = { version = "4", features = ["derive", "env"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Lockstep releases: every crate shares one version and one vX.Y.Z tag
[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
publish = false
