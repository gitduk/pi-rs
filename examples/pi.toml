# ~/.pi/settings.toml — copy what you need and delete the rest.
#
# There is no built-in list of models. One would go stale the week a vendor
# ships something, and nothing in it would tell you which entries still
# describe reality. What follows was measured against live endpoints on the
# date in each comment; treat it as a starting point, not as current.
#
# pi talks to one endpoint at a time, so the endpoint is this file. A model is
# named the way that endpoint names it, and nothing else.

# ---------------------------------------------------------------------------
# The endpoint.
#
# `format` is the shape pi speaks, not the vendor: `anthropic` is the Messages
# API, `openai` the Responses API, `chat` Chat Completions.
# ---------------------------------------------------------------------------
base_url = "https://api.anthropic.com"
format   = "anthropic"           # anthropic | openai | chat

# A `$` reads the environment; anything else is the key itself. A literal key
# beginning with `$` cannot be written here — put it in a variable.
api_key  = "$ANTHROPIC_API_KEY"

# Anthropic only, and off unless someone measured it: an unknown top-level
# field is a 400 on some servers. `standard` is the 5-minute breakpoint,
# `long_ttl` the 1-hour one.
cache_control = "standard"

# ---------------------------------------------------------------------------
# Snap judgments, delegated.
#
# A second endpoint a run can put typed questions to — classify this, score
# that, how likely is this true — and get structured answers back, without a
# turn of generation. Present, the `judge` tool is in the set; commented out,
# it does not exist and the model never sees it. Only this file can set it:
# a cloned `pi.toml` must not choose where this machine's state gets judged.
# ---------------------------------------------------------------------------
# [judge]
# base_url = "https://api.typesafe.ai/v1"
# api_key  = "$TYPESAFE_API_KEY"   # a `$` reads the environment, as above
# model    = "jev-latest"          # absent, the endpoint serves its default

# ---------------------------------------------------------------------------
# What to run.
# ---------------------------------------------------------------------------

# What the endpoint calls the model. Omit it when the file describes exactly
# one model — there is nothing else it could mean.
model = "claude-sonnet-5"

# Who writes the summary when history is compacted. Big input, small output,
# little judgement — so it need not be the model doing the work. Defaults to
# `model`.
summarize_model = "claude-haiku-4-5"

effort = "medium"                # off | low | medium | high
tier   = "exec"                  # read | write | exec | net

# How many rounds a `/loop` may run before it stops on its own. Unset is 10 —
# a loop ends on its own when a round changes nothing, when a round undoes the
# last one, or when rounds only nibble; this is the floor for a loop that keeps
# changing files forever. Esc is always the brake.
loop_max_rounds = 10

# Seconds a subagent may run silent before it is read as wedged. Unset is 1800.
# The only thing that stops a subagent on its own: it is not capped by turns.
# subagent_deadline = 1800

# How many times to retry a request the provider could not serve, and how many
# seconds of silence before a stream counts as wedged. The second is generous
# on purpose: a reasoning model can legitimately think for minutes before its
# first token.
retries = 4
idle_timeout = 300

# Replaces the built-in system prompt. Rarely what you want: the built-in one
# is what the tools were written against.
# system = "~/.pi/system.md"

# Absolute directories the tools above the read tier may reach besides the
# workspace root — this widens where `bash` may work as well as what write and
# edit may touch, so grant it the way you would a shell. Entries must be
# absolute; a directory that does not exist yet is created on first write.
# Empty by default: those tools stay inside the workspace. Read tools already
# reach anywhere.
# write_roots = ["/tmp", "/home/me/scratch"]

# Which parts the status line under the answer shows, in this order. One
# list: the line repaints while a turn runs and stays in the scrollback once it
# ends. Naming none keeps this default.
#
# The spend parts — in_out, cache and cost — are the run's own: what this
# answer has cost since you sent it, not what the session had before it. The
# session's running total is the `spent:` line `/status` prints, and no part
# of the status line reads it.
#
#   elapsed    3s / 2m05s — nothing times a one-shot run, so it drops there
#   in_out     8.4k in / 390 out, a dash for a half the provider never stated
#   cache      41.2k cached, left out when nothing was read from cache
#   cost       $0.0012, left out when the model carries no pricing
#   ctx        ctx 54/743.4k, the transcript against what it may occupy
#   compacted  compacted 2×, left out when the run never shrank the transcript
#   queued     2 queued — lines submitted while the run worked
#   model      deepseek-v4-flash
#   worktree   feature-one, left out in the repository's own checkout
#
# A part with nothing to say is left out rather than shown empty, so one list
# serves the running line and the finished one: `queued` is gone once the run
# ends, `cost` until something has been spent.
status = ["elapsed", "in_out", "cache", "ctx", "compacted", "queued", "cost"]

# ---------------------------------------------------------------------------
# Facts about a model the defaults get wrong.
#
# Every field below has a default, so a model needs an entry only where it
# differs — and needs none at all to be usable. An unlisted name is passed
# through to the endpoint with the defaults: a 128k window, 8k of output, no
# pricing and no thinking.
# ---------------------------------------------------------------------------

# Measured 2026-08-14.
[models."claude-sonnet-5"]
context_window    = 200_000
max_output_tokens = 64_000
vision            = true
# How the model takes a thinking instruction, absent if it takes none.
# `adaptive` is Claude 4.6+, `budget` 4.5 and earlier, `effort` the OpenAI
# Responses control. Naming one the format cannot carry is refused at load.
thinking          = "adaptive"
# Claude 4.6+ and the OpenAI reasoning models reject every temperature but the
# default, so the only request they accept is one that omits it.
accepts_temperature = false
pricing = { input_per_mtok = 3.0, output_per_mtok = 15.0, cache_read_per_mtok = 0.3, cache_write_per_mtok = 3.75 }

# Measured 2026-08-14.
[models."claude-haiku-4-5"]
context_window    = 200_000
max_output_tokens = 32_000
thinking          = "budget"
pricing = { input_per_mtok = 1.0, output_per_mtok = 5.0 }

# What becomes of reasoning another model produced, when the transcript moves
# here by `/model`. `off` leaves it out — what the docs say to do, and the
# cheapest. `tagged` wraps it in `<think>`, for models trained to read that.
# Reasoning this model itself signed always replays as itself and is not
# governed by this.
[models."some-open-weights-model"]
replay_thinking = "tagged"

# ---------------------------------------------------------------------------
# A second endpoint is not a config shape. Point `base_url` at the one you
# want, or keep two files and pass `--config`.
# ---------------------------------------------------------------------------

[keys]
# An entry replaces that action's defaults rather than adding to them.
"menu.accept"   = ["tab"]
"menu.next"     = ["down", "ctrl+n"]
"menu.previous" = ["up", "ctrl+p"]
