# ~/.pi/settings.toml — copy what you need and delete the rest.
#
# There is no built-in list of models. One would go stale the week a vendor
# ships something, and nothing in it would tell you which entries still
# describe reality. What follows was measured against live endpoints on the
# date in each comment; treat it as a starting point, not as current.
#
# pi talks to one endpoint at a time, so the endpoint is this file. A model is
# named the way that endpoint names it, and nothing else.

# ---------------------------------------------------------------------------
# The endpoint.
#
# `format` is the shape pi speaks, not the vendor: `anthropic` is the Messages
# API, `openai` the Responses API, `chat` Chat Completions.
# ---------------------------------------------------------------------------
base_url = "https://api.anthropic.com"
format   = "anthropic"           # anthropic | openai | chat

# A `$` reads the environment; anything else is the key itself. A literal key
# beginning with `$` cannot be written here — put it in a variable.
api_key  = "$ANTHROPIC_API_KEY"

# Anthropic only, and off unless someone measured it: an unknown top-level
# field is a 400 on some servers. `standard` is the 5-minute breakpoint,
# `long_ttl` the 1-hour one.
cache_control = "standard"

# ---------------------------------------------------------------------------
# What to run.
# ---------------------------------------------------------------------------

# What the endpoint calls the model. Omit it when the file describes exactly
# one model — there is nothing else it could mean.
model = "claude-sonnet-5"

# Who writes the summary when history is compacted. Big input, small output,
# little judgement — so it need not be the model doing the work. Defaults to
# `model`.
summarize_model = "claude-haiku-4-5"

# How hard the model thinks, on every wire alike; unset is `high`.
effort = "medium"                # off | low | medium | high
tier   = "exec"                  # read | write | exec | net

# How many rounds a `/loop` may run before it stops on its own. Unset is 10 —
# a loop ends on its own when a round changes nothing, when a round undoes the
# last one, or when rounds only nibble; this is the floor for a loop that keeps
# changing files forever. Esc is always the brake.
loop_max_rounds = 10

# Seconds a subagent may run silent before it is read as wedged. Unset is 1800.
# The only thing that stops a subagent on its own: it is not capped by turns.
# subagent_deadline = 1800

# How many times to retry a request the provider could not serve, and how many
# seconds of silence before a stream counts as wedged. The second is generous
# on purpose: a reasoning model can legitimately think for minutes before its
# first token.
retries = 4
idle_timeout = 300

# Days a session, and an image pasted with ctrl+v, is kept after it was last
# worked on; an older one is deleted when pi starts. Unset is 90, 0 keeps
# everything.
# keep_days = 90

# Which parts the status line under the answer shows, in this order. One
# list: the line repaints while a turn runs and stays in the scrollback once it
# ends. Naming none keeps this default.
#
# The spend parts — in_out, cache and cost — are the run's own: what this
# answer has cost since you sent it, not what the session had before it. The
# session's running total is the `spent:` line `/status` prints and the bar's
# `spent` part, and no part of the status line reads it.
#
#   elapsed    3s / 2m05s — nothing times a one-shot run, so it drops there
#   in_out     8.4k in / 390 out, each half once the provider states it
#   speed      41 t/s, output over the time the model spent streaming it,
#              left out until a turn has streamed
#   cache      96% cached, the run's prompt tokens read from cache,
#              left out until a request has reported its prompt
#   cost       $0.0012, left out when the model carries no pricing
#   ctx        ctx 9.6k/1m, the request against the model's window
#   compacted  compacted / compacted ×2, left out when the run never shrank the transcript
#   queued     2 queued — waiting work not drawn as a line: a job's input,
#              a command like /settings typed while the run worked
#   model      deepseek-v4-flash
#   worktree   feature-one, left out in the repository's own checkout
#
# A part with nothing to say is left out rather than shown empty, so one list
# serves the running line and the finished one: `queued` is gone once the run
# ends, `cost` until something has been spent.
status = ["elapsed", "in_out", "speed", "cache", "ctx", "cost", "compacted", "queued"]

# ---------------------------------------------------------------------------
# Facts about a model the defaults get wrong.
#
# Every field below has a default, so a model needs an entry only where it
# differs — and needs none at all to be usable. An unlisted name is passed
# through to the endpoint with the defaults: a 128k window, 8k of output and no
# pricing.
# ---------------------------------------------------------------------------

# Measured 2026-08-14.
[models."claude-sonnet-5"]
context_window    = 200_000
max_output_tokens = 64_000
vision            = true
# Claude 4.6+ and the OpenAI reasoning models reject every temperature but the
# default, so the only request they accept is one that omits it.
accepts_temperature = false
pricing = { input_per_mtok = 3.0, output_per_mtok = 15.0, cache_read_per_mtok = 0.3, cache_write_per_mtok = 3.75 }

# Measured 2026-08-14.
[models."claude-haiku-4-5"]
context_window    = 200_000
max_output_tokens = 32_000
pricing = { input_per_mtok = 1.0, output_per_mtok = 5.0 }

# A model that cannot think is told nothing of thinking, `off` included: on
# some endpoints the field alone is a 400.
[models."gpt-4.1"]
effort = "unsupported"

# A model on another endpoint names its own `base_url`, and `format` and
# `api_key` when they differ. One that names a `base_url` never inherits the
# file's `api_key` — the file's key is for the file's host — so without its
# own it falls back to OPENAI_API_KEY or ANTHROPIC_API_KEY by its format.
[models."gpt-5"]
base_url = "https://api.openai.com/v1"
format   = "openai"
api_key  = "$OPENAI_API_KEY"
context_window    = 400_000
max_output_tokens = 128_000

# Commands run on events by `sh -c` in the workspace, each handed the event
# as one line of JSON on stdin. `tool.before` and `tool.after` are gates, given
# {"tool", "args", "workspace"} ("result" too, after): before a call, exit 0
# lets it run and exit 2 refuses it with what the hook printed; any other exit,
# or no answer in 30s, refuses it as a broken hook. After one, what it printed
# is added to the result. `run.start` is waited on before a run's first
# request, given {"event", "workspace", "prompt"}; what it prints on exit 0 is
# a note to the model, so print only what is new. `run.stop` is waited on when
# the model would stop, given {"event", "workspace", "text", "held"}: exit 2
# keeps the run going, what it printed told to the model, at most 3 times a
# run (`held` counts them); any other exit lets it stop. Every other event is
# only watched: {"event", "workspace", …its fields}, queued and run one at a
# time, only a failure journaled, never seen by the run. Those events are
# tool.denied, turn.start, turn.end (the reply's text with it), compacted,
# retrying, warning, run.done and run.failed (the error with it). `tools` narrows the tool.* events; empty is every tool.
# [[hooks]]
# on      = ["tool.before"]
# tools   = ["bash"]
# command = "~/.pi/hooks/ask-first"   # examples/hooks/: asks you first
#
# [[hooks]]
# on      = ["run.done"]
# command = "notify-send pi 'run done'"
#
# [[hooks]]
# on      = ["run.start"]
# command = "~/.pi/hooks/recent-commands.sh"
#
# [[hooks]]
# on      = ["run.stop"]
# command = "cargo test -q >/dev/null 2>&1 || { echo 'tests fail'; exit 2; }"

# MCP servers, each one's tools offered as `<name>__<tool>`. A value that is
# `$NAME` reads pi's environment.
[mcp.github]
command = "github-mcp-server"
args    = ["stdio"]
env     = { GITHUB_TOKEN = "$GITHUB_TOKEN" }

[mcp.docs]
url     = "https://example.com/mcp"
headers = { Authorization = "$DOCS_AUTHORIZATION" }

[keys]
# An entry replaces that action's defaults rather than adding to them.
# `/keys` lists every id. Two presses apart by a space are a pair.
"menu.accept"   = ["tab"]
"menu.next"     = ["down", "ctrl+n"]
"menu.previous" = ["up", "ctrl+p"]
"mode.normal"   = ["j k"]   # Insert to Normal; [] leaves no way in

[vim]
enabled = true
# How long the first of a pair of bare characters (`j k`, `g g`, `d d`)
# waits for the second. Pairs with ctrl, alt or a named key wait 500 ms.
pair_timeout_ms = 250
# The cursor in each mode: block, bar, underline, or default (the terminal's own).
insert_cursor = "bar"
normal_cursor = "block"
